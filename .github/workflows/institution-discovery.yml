name: Weekly institution discovery

on:
  workflow_dispatch:
  schedule:
    # Saturdays at 14:00 UTC (between monthly hygiene and daily scrape)
    - cron: "0 14 * * 6"

permissions:
  contents: write

concurrency:
  group: institution-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Check for merge conflict markers
        run: npm run verify:no-conflicts

      - name: Seed new institutions from IPEDS WEBADDR
        run: npm run seed:ipeds:webaddr

      - name: Probe career paths for missing institutions
        # Discovers real /careers, /jobs, /employment pages for institutions whose
        # career_url is still just the homepage; writes them into the master.
        run: npm run probe:careers

      - name: Generate promotion candidates report
        run: npm run promote:seeded

      - name: Auto-promote candidates into scrape config
        run: npm run promote:apply

      - name: Sync discovered career URLs into scrape config
        # Refresh existing campuses' stale hardcoded URLs with the real career
        # pages found by the probe so the daily scrape (with ATS hand-off) can use them.
        run: npm run promote:discovered:apply

      - name: Rebuild institutions and coverage artifacts
        run: npm run build:coverage

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add server.js \
            data/institutions-master.json \
            generated/scrape-config-additions.json \
            generated/promotion-candidates.json \
            generated/promotion-candidates-snippets.js \
            generated/promotion-candidates.csv \
            generated/promotion-candidates-next-batch.json \
            generated/promotion-apply-report.json \
            generated/promotion-apply-discovered-report.json \
            generated/career-path-probe-report.json \
            generated/coverage-report.json \
            generated/policy-excluded-colleges.json \
            public/policy-excluded-colleges.json \
            docs/policy-excluded-colleges.json \
            web-vue/public/policy-excluded-colleges.json

          if git diff --cached --quiet; then
            echo "No new institutions discovered this week."
            exit 0
          fi

          APPLIED=$(node -e "
            try {
              const r = JSON.parse(require('fs').readFileSync('generated/promotion-apply-report.json','utf8'));
              console.log(r.appliedCount || 0);
            } catch { console.log(0); }
          ")
          DISCOVERED=$(node -e "
            try {
              const r = JSON.parse(require('fs').readFileSync('generated/promotion-apply-discovered-report.json','utf8'));
              console.log((r.updatedCount || 0) + (r.appliedCount || 0));
            } catch { console.log(0); }
          ")

          git commit -m "Weekly institution discovery — seed IPEDS + promote ${APPLIED} new, refresh ${DISCOVERED} probed career URLs"

          # main moves often (daily scrape, frontend-deploy, agent runs), so a plain
          # push races and fails with non-fast-forward. Retry: rebase onto latest,
          # preferring this run's freshly-rebuilt artifacts on conflict (-X theirs).
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt ${attempt}) — rebasing onto latest origin/main…"
            git pull --rebase -X theirs --autostash origin main || git rebase --abort
          done
          echo "::error::Push still failing after 5 rebase/retry attempts." >&2
          exit 1
