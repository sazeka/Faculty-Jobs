name: Agent team - data health

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 19:00 UTC (after the 16:15 UTC daily scrape finishes)
    - cron: "0 19 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: agent-team
  cancel-in-progress: true

jobs:
  data-health:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Check for merge conflict markers
        run: npm run verify:no-conflicts

      - name: Verify job posting URLs (sample)
        run: npm run verify:job-urls -- --sample-per-source 10 --concurrency 8
        continue-on-error: true

      - name: Run data-health agent (remove dead listings, strip HTML titles, baseline check)
        run: npm run agent:data-health
        continue-on-error: true

      - name: Track job presence and purge expired listings
        run: npm run agent:job-presence
        continue-on-error: true

      - name: Install Playwright Chromium (for description backfill)
        run: npx playwright install --with-deps chromium

      - name: Backfill missing job descriptions from detail pages
        timeout-minutes: 45
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Keep the 1,600-page daily capacity, but divide it into recoverable
          # commits. If a later browser batch wedges or times out, all completed
          # batches remain in the checkout for the checkpoint step below.
          for batch in 1 2 3 4; do
            echo "Running description batch ${batch}/4"
            npm run agent:descriptions -- --max 400 --concurrency 8
            git add public/jobs.json docs/jobs.json generated/job-descriptions-report.json
            if ! git diff --cached --quiet; then
              git commit -m "Description backfill checkpoint ${batch}/4"
            fi
          done
        continue-on-error: true

      - name: Push description checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Preserve a partially completed batch too: the script atomically
          # saves every 25 attempts, including when the preceding step times out.
          git add public/jobs.json docs/jobs.json generated/job-descriptions-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Description backfill partial checkpoint"
          fi

          if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then
            echo "No description changes to push."
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            if git push; then break; fi
            echo "Push rejected (attempt ${attempt}) — rebasing onto latest origin/main…"
            git pull --rebase -X theirs --autostash origin main || git rebase --abort
            if [ "${attempt}" = "5" ]; then echo "::error::Checkpoint push still failing after 5 attempts." >&2; exit 1; fi
          done

      # Enrichment must follow description backfill: title-only inference often
      # cannot determine appointment track, while the posting body can state it.
      - name: Enrich jobs with discipline, tenure status, and position type
        run: npm run agent:enrich -- --max 500
        continue-on-error: true
        env:
          AI_BACKEND: rules-only

      - name: Rebuild web data chunks from updated jobs.json
        run: |
          node scripts/sync-web-data-files.js
          cp -R web-vue/public/data/. docs/data/
          cp -R web-vue/public/data/. public/data/
          node scripts/inject-og-meta.js

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            public/jobs.json \
            docs/jobs.json \
            docs/index.html \
            public/index.html \
            docs/data/ \
            public/data/ \
            generated/job-url-cache.json \
            generated/job-url-report.json \
            generated/job-url-dead.json \
            generated/source-count-baseline.json \
            generated/data-health-report.json \
            generated/job-presence.json \
            generated/job-presence-report.json \
            generated/enrichment-report.json \
            generated/job-descriptions-report.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Agent team: data health pass"

          # main moves often (other scheduled workflows + manual commits), so a bare
          # push races and fails non-fast-forward. Retry: rebase onto latest,
          # preferring this run's freshly-built artifacts on conflict (-X theirs).
          for attempt in 1 2 3 4 5; do
            if git push; then break; fi
            echo "Push rejected (attempt ${attempt}) — rebasing onto latest origin/main…"
            git pull --rebase -X theirs --autostash origin main || git rebase --abort
            if [ "${attempt}" = "5" ]; then echo "::error::Push still failing after 5 attempts." >&2; exit 1; fi
          done

      - name: Open GitHub Issues for critical alerts
        run: npm run agent:alert-issues
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
