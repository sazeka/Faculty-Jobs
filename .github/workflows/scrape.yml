name: Daily scrape

on:
  # Manual-only. The nightly local daily-update.ps1 is the primary scraper — it
  # has local Ollama so it can enrich + stamp firstSeen, which CI can't. Running
  # both double-scraped and raced pushes on main, so the scheduled cron is
  # removed; trigger here manually (Run workflow) when a CI scrape is wanted.
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-scrape
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Check for merge conflict markers
        run: npm run verify:no-conflicts

      - name: Install Playwright Chromium (with deps)
        run: npx playwright install --with-deps chromium

      - name: Verify critical institution career links
        run: npm run verify:career-links -- --critical-only --fail-on-broken --concurrency 4 --timeout 15000

      - name: Verify all institution career links (report + quarantine)
        run: npm run verify:career-links -- --quarantine-threshold 2 --concurrency 12 --timeout 12000

      - name: Validate critical school checks from report
        run: npm run verify:critical-schools

      - name: Build coverage + exclusions artifacts
        run: npm run build:coverage

      - name: Verify policy integrity (pre-scrape)
        run: npm run verify:policy:pre

      - name: Run scraper (write docs/jobs.json)
        run: npm run scrape:json

      - name: Verify post quality
        run: npm run verify:post-quality -- --max-nonjob 0 --max-nonhttps-pct 1 --max-missing-desc-pct 95 --max-placeholder-titles 0

      - name: Verify policy integrity (post-scrape)
        run: npm run verify:policy

      # The earlier "Build coverage + exclusions artifacts" step runs before
      # the scrape on purpose (verify:policy:pre --skip-jobs-check just needs
      # a fresh exclusions list, not final numbers) — but that means the
      # coverage-report.json/institutions-master.json committed at the end of
      # this workflow were, until now, always built from the OLD jobs.json,
      # never reflecting the scrape this same run just did. Rebuild once more
      # now that public/jobs.json is current.
      - name: Rebuild coverage + institutions artifacts (post-scrape)
        run: npm run build:coverage

      - name: Rebuild web data chunks from updated jobs.json
        run: |
          node scripts/sync-web-data-files.js
          cp -R web-vue/public/data/. docs/data/
          cp -R web-vue/public/data/. public/data/
          node scripts/generate-sitemap.js
          node scripts/inject-og-meta.js

      - name: Validate job posting URLs (sample per source)
        run: npm run verify:job-urls -- --sample-per-source 8 --concurrency 8
        continue-on-error: true

      - name: Run data-health agent (remove dead listings, strip HTML titles)
        run: npm run agent:data-health
        continue-on-error: true

      - name: Track job presence and purge expired listings
        run: npm run agent:job-presence
        continue-on-error: true

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/jobs.json public/jobs.json docs/data/ public/data/ docs/index.html public/index.html docs/sitemap.xml public/sitemap.xml docs/robots.txt public/robots.txt generated/post-quality-report.json generated/post-quality-drift.json generated/post-quality-dashboard.html generated/policy-excluded-colleges.json generated/coverage-report.json generated/career-link-verification.json generated/institution-link-status.json generated/career-link-quarantine.json generated/career-link-health-state.json generated/job-url-cache.json generated/job-url-report.json generated/job-url-dead.json generated/job-url-dedup-report.json generated/source-count-baseline.json generated/data-health-report.json generated/job-presence.json generated/job-presence-report.json public/policy-excluded-colleges.json docs/policy-excluded-colleges.json web-vue/public/policy-excluded-colleges.json data/institutions-master.json data/career-url-overrides.json data/post-quality-source-thresholds.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Daily update jobs and policy artifacts"

          # main moves often (other scheduled workflows + manual commits), so a bare
          # push races and fails non-fast-forward. Retry: rebase onto latest,
          # preferring this run's freshly-built artifacts on conflict (-X theirs).
          for attempt in 1 2 3 4 5; do
            if git push; then break; fi
            echo "Push rejected (attempt ${attempt}) — rebasing onto latest origin/main…"
            git pull --rebase -X theirs --autostash origin main || git rebase --abort
            if [ "${attempt}" = "5" ]; then echo "::error::Push still failing after 5 attempts." >&2; exit 1; fi
          done

      - name: Monitor live site
        run: npm run monitor:live
        continue-on-error: true

      - name: Open GitHub Issues for critical alerts
        run: npm run agent:alert-issues
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
