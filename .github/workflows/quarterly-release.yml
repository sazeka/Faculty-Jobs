name: Quarterly research release

# Builds a dated research release (data/releases/) for the Harvard Dataverse
# deposit (doi:10.7910/DVN/FP3SME), commits it, and opens an issue with the
# upload steps. Uploading and publishing stay manual: the contact email lives
# in the git-ignored data/dataverse-deposit.local.json, and a published
# Dataverse version is permanent, so a person reviews it first.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Release date tag (YYYY-MM-DD). Defaults to today (UTC)."
        required: false
  schedule:
    # 14:00 UTC on the 2nd of Jan/Apr/Jul/Oct: after the 1st's scrape (03:17,
    # done by ~12:00) and the monthly data-hygiene pass (13:00 on the 1st).
    - cron: "0 14 2 1,4,7,10 *"

permissions:
  contents: write
  issues: write

concurrency:
  group: quarterly-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: |
          npm ci
          pip install --quiet jsonschema

      - name: Resolve release date
        id: date
        run: |
          DATE="${{ inputs.date }}"
          DATE="${DATE:-$(date -u +%F)}"
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::Invalid date '$DATE'"; exit 1; }
          echo "value=$DATE" >> "$GITHUB_OUTPUT"

      - name: Release exporter tests
        run: node --test scripts/__tests__/release-dataset.test.js

      - name: Build release
        run: npm run release:dataset -- --date "${{ steps.date.outputs.value }}"

      - name: Validate release
        env:
          DATE: ${{ steps.date.outputs.value }}
        run: |
          python3 - <<'EOF'
          import datetime as dt, json, os, sys, jsonschema
          date = os.environ["DATE"]
          meta = json.load(open(f"data/releases/{date}.metadata.json"))
          release = json.load(open(f"data/releases/{date}.json"))
          errors = list(jsonschema.Draft202012Validator(json.load(open("data/release-schema.json"))).iter_errors(release))
          if errors:
              sys.exit(f"::error::{len(errors)} schema errors, first: {errors[0].message}")
          # A failing scraper leaves public/jobs.json stale; archiving it under a
          # new date would misstate when the postings were observed.
          scraped = dt.datetime.fromisoformat(meta["scrapedAt"].replace("Z", "+00:00"))
          age = dt.datetime.now(dt.timezone.utc) - scraped
          if age > dt.timedelta(days=4):
              sys.exit(f"::error::Snapshot is {age.days} days old (scrapedAt {meta['scrapedAt']}); fix the scrape first.")
          ids = [j["canonicalJobId"] for j in release["jobs"]]
          if len(ids) != len(set(ids)):
              sys.exit("::error::Duplicate canonicalJobId in release")
          if meta["count"] < 15000:
              sys.exit(f"::error::Only {meta['count']} records; expected 15,000+. Check for a partial scrape.")
          print(f"OK: {meta['count']} records, scrapedAt {meta['scrapedAt']}, sourceCommit {meta['sourceCommit']}")
          EOF

      - name: Check Dataverse packaging
        # Without the git-ignored local deposit file the packager reports the
        # contact email as missing; that is expected here.
        run: npm run package:dataverse -- --date "${{ steps.date.outputs.value }}"

      - name: Commit & push release
        env:
          DATE: ${{ steps.date.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/releases
          if git diff --cached --quiet; then
            echo "Release $DATE is unchanged."
            exit 0
          fi
          git commit -m "Research release $DATE"

          # main moves often (other scheduled workflows + manual commits), so a bare
          # push races and fails non-fast-forward. Retry: rebase onto latest,
          # preferring this run's freshly-built artifacts on conflict (-X theirs).
          for attempt in 1 2 3 4 5; do
            if git push; then break; fi
            echo "Push rejected (attempt ${attempt}) — rebasing onto latest origin/main…"
            git pull --rebase -X theirs --autostash origin main || git rebase --abort
            if [ "${attempt}" = "5" ]; then echo "::error::Push still failing after 5 attempts." >&2; exit 1; fi
          done

      - name: Open upload issue
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.date.outputs.value }}
        run: |
          COUNT=$(python3 -c "import json;print(f\"{json.load(open('data/releases/$DATE.metadata.json'))['count']:,}\")")
          cat > issue-body.md <<EOF
          The quarterly research release **$DATE** ($COUNT records) is committed to \`data/releases/\`.

          Upload it as a new version of [doi:10.7910/DVN/FP3SME](https://doi.org/10.7910/DVN/FP3SME):

          1. Pull and build the package (needs your local \`data/dataverse-deposit.local.json\`):
             \`\`\`bash
             git pull && npm run package:dataverse -- --date $DATE
             \`\`\`
          2. Update \`data/release-validation.md\` first if any benchmark was rerun this quarter, then re-run step 1.
          3. In your own terminal, set \`DATAVERSE_API_TOKEN\` and run:
             \`\`\`bash
             bash generated/dataverse/$DATE/upload.sh
             \`\`\`
             It starts a new draft version and replaces the previous snapshot's files.
          4. Review the [draft](https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/FP3SME&version=DRAFT): file list, data preview row count, metadata.
          5. Publish. Choose a **major** version when the data changes; minor is for metadata-only fixes.
          6. Update the version in \`CITATION.cff\` and close this issue.
          EOF
          gh issue create --title "Upload research release $DATE to Harvard Dataverse" --body-file issue-body.md
