name: Monthly data hygiene

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 1 * *"

permissions:
  contents: write

concurrency:
  group: monthly-data-hygiene
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Check for merge conflict markers
        run: npm run verify:no-conflicts

      - name: Discover career pages (diff report)
        run: npm run discover:careers

      - name: Verify all institution career links
        run: npm run verify:career-links -- --quarantine-threshold 2 --concurrency 12 --timeout 12000

      - name: Rebuild institutions and coverage artifacts
        run: npm run build:coverage

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add generated/career-discovery-report.json generated/career-discovery-review.csv generated/career-link-verification.json generated/institution-link-status.json generated/career-link-quarantine.json generated/career-link-health-state.json generated/coverage-report.json generated/policy-excluded-colleges.json public/policy-excluded-colleges.json docs/policy-excluded-colleges.json web-vue/public/policy-excluded-colleges.json data/institutions-master.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Monthly data hygiene refresh"

          # main moves often (other scheduled workflows + manual commits), so a bare
          # push races and fails non-fast-forward. Retry: rebase onto latest,
          # preferring this run's freshly-built artifacts on conflict (-X theirs).
          for attempt in 1 2 3 4 5; do
            if git push; then break; fi
            echo "Push rejected (attempt ${attempt}) — rebasing onto latest origin/main…"
            git pull --rebase -X theirs --autostash origin main || git rebase --abort
            if [ "${attempt}" = "5" ]; then echo "::error::Push still failing after 5 attempts." >&2; exit 1; fi
          done
