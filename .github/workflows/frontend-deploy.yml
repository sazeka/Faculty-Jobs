name: Build & deploy frontend

# Rebuilds the Vue bundle and commits the result into docs/ + public/ (GitHub
# Pages serves docs/ on main). Runs only when frontend SOURCE changes — never on
# data commits — so it doesn't loop or race the scrape/agent-team data workflows.
# Previously the bundle was only rebuilt by a manual `npm run build:frontend`.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web-vue/src/**"
      - "web-vue/index.html"
      - "web-vue/vite.config.*"
      - "web-vue/package.json"
      - "web-vue/package-lock.json"
      - "scripts/copy-dist.js"
      - "scripts/inject-og-meta.js"
      - "scripts/generate-sitemap.js"

permissions:
  contents: write

concurrency:
  group: frontend-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps (root)
        run: npm ci

      - name: Install deps (web-vue — has its own package.json)
        run: npm --prefix web-vue ci

      - name: Check for merge conflict markers
        run: npm run verify:no-conflicts

      - name: Build frontend (coverage + web data + Vue bundle + sitemap + OG meta)
        run: npm run build:frontend

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage ONLY the built bundle (entry HTML + hashed assets + sitemap).
          # Never commit data here — the chunks/jobs.json are owned by the scrape
          # and agent-team workflows, and build:frontend's sync:web-data can emit
          # un-enriched chunks mid-cycle. Restore any data files the build touched
          # so a deploy can't regress enrichment.
          git checkout -- docs/data public/data docs/jobs.json public/jobs.json 2>/dev/null || true
          git add -A docs/assets public/assets
          git add docs/index.html public/index.html \
            docs/sitemap.xml public/sitemap.xml docs/robots.txt public/robots.txt \
            docs/CNAME public/CNAME

          if git diff --cached --quiet; then
            echo "No bundle changes to deploy."
            exit 0
          fi

          git commit -m "Build & deploy frontend bundle"

          # Rebase onto any commits the data workflows pushed meanwhile, then push.
          if ! git push; then
            git pull --rebase origin main
            git push
          fi
