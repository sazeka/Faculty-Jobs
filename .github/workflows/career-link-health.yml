name: Weekly career link health

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1"

permissions:
  contents: write

concurrency:
  group: weekly-career-link-health
  cancel-in-progress: true

jobs:
  verify-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Playwright Chromium (with deps)
        run: npx playwright install --with-deps chromium

      - name: Check for merge conflict markers
        run: npm run verify:no-conflicts

      - name: Audit dependencies for high/critical vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Audit web-vue dependencies
        run: cd web-vue && npm audit --audit-level=high
        continue-on-error: true

      - name: Verify critical institution career links
        # --max-broken 1: Dean College (interviewexchange.com) fails this check
        # reliably from any automated environment, including a fresh runner with
        # no prior request history -- a persistent anti-automation wall, not a
        # real outage (verified live via direct isolated checks). Zero-tolerance
        # here turned one chronically-flaky-from-CI's-perspective school into a
        # weekly false-alarm failure. Tolerating 1 absorbs that specific known
        # case while still catching a genuine multi-school break.
        run: npm run verify:career-links -- --critical-only --fail-on-broken --max-broken 1 --concurrency 4 --timeout 15000

      - name: Verify all institution career links
        run: npm run verify:career-links -- --quarantine-threshold 2 --concurrency 12 --timeout 12000

      - name: Validate critical school checks
        run: npm run verify:critical-schools -- --max-broken 1

      - name: Rebuild institutions with verification metadata
        run: npm run build:institutions

      - name: Validate job posting URLs (larger sample for weekly run)
        run: npm run verify:job-urls -- --sample-per-source 20 --concurrency 10
        continue-on-error: true

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add generated/career-link-verification.json generated/institution-link-status.json generated/career-link-quarantine.json generated/career-link-health-state.json generated/job-url-cache.json generated/job-url-report.json generated/job-url-dead.json data/institutions-master.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Weekly career link health verification"

          # main moves often (other scheduled workflows + manual commits), so a bare
          # push races and fails non-fast-forward. Retry: rebase onto latest,
          # preferring this run's freshly-built artifacts on conflict (-X theirs).
          for attempt in 1 2 3 4 5; do
            if git push; then break; fi
            echo "Push rejected (attempt ${attempt}) — rebasing onto latest origin/main…"
            git pull --rebase -X theirs --autostash origin main || git rebase --abort
            if [ "${attempt}" = "5" ]; then echo "::error::Push still failing after 5 attempts." >&2; exit 1; fi
          done
