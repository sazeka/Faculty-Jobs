name: Weekly trends digest

on:
  workflow_dispatch:
  schedule:
    # Sundays at 20:00 UTC (after the daily scrape + agent-team pass)
    - cron: "0 20 * * 0"

permissions:
  contents: write
  models: read

concurrency:
  group: weekly-trends
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Generate weekly trends (with AI summary)
        run: node scripts/generate-weekly-trends.js
        env:
          AI_BACKEND: github-models
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate indexable trends pages
        run: node scripts/generate-trends-pages.js

      - name: Regenerate sitemap (picks up new /trends/ pages)
        run: node scripts/generate-sitemap.js

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            docs/data/weekly-trends.json \
            public/data/weekly-trends.json \
            generated/weekly-stats-history.json \
            generated/trends-pages.json \
            docs/trends \
            docs/sitemap.xml public/sitemap.xml \
            docs/robots.txt public/robots.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Weekly trends digest"

          # main moves often (other scheduled workflows + manual commits), so a bare
          # push races and fails non-fast-forward. Retry: rebase onto latest,
          # preferring this run's freshly-built artifacts on conflict (-X theirs).
          for attempt in 1 2 3 4 5; do
            if git push; then break; fi
            echo "Push rejected (attempt ${attempt}) — rebasing onto latest origin/main…"
            git pull --rebase -X theirs --autostash origin main || git rebase --abort
            if [ "${attempt}" = "5" ]; then echo "::error::Push still failing after 5 attempts." >&2; exit 1; fi
          done
