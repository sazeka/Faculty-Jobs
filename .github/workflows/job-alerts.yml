name: Job alert digests

on:
  workflow_dispatch:
  schedule:
    # Daily at 21:00 UTC — after the scrape + agent-team pass.
    - cron: "0 21 * * *"

concurrency:
  group: job-alerts
  cancel-in-progress: true

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps (root)
        run: npm ci

      # send-job-alerts.js imports web-vue/src/composables/useJobFilters.js,
      # which imports 'vue' — resolved from web-vue's own node_modules.
      - name: Install deps (web-vue — has its own package.json)
        run: npm --prefix web-vue ci

      # Subscriber state lives in the job-alerts Worker's KV, not this repo,
      # so this workflow only reads/sends — no git-commit step and no
      # `contents: write` permission needed.
      - name: Send job alert digests
        run: node scripts/send-job-alerts.js
        env:
          JOB_ALERTS_WORKER_URL: ${{ secrets.JOB_ALERTS_WORKER_URL }}
          ALERTS_INTERNAL_SECRET: ${{ secrets.ALERTS_INTERNAL_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
