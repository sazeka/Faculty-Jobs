name = "faculty-atlas-job-alerts"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Create with: wrangler kv namespace create ALERTS_KV
# then paste the returned id below.
kv_namespaces = [
  { binding = "ALERTS_KV", id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID" }
]

[vars]
ALLOWED_ORIGINS = "https://www.facultyatlas.org,http://localhost:5173,http://localhost:4173"
FROM_EMAIL = "alerts@facultyatlas.org"

# Secrets (not set here — run these once after `wrangler login`):
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put ALERTS_INTERNAL_SECRET
