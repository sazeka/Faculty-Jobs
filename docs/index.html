<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Faculty Jobs (Static)</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; padding: 24px; background: #fafafa; }
      header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
      .muted { color: #666; font-size: 14px; }
      .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      input, select { padding: 10px 12px; border: 1px solid #ddd; border-radius: 10px; min-width: 240px; background: white; }
      select { min-width: 200px; }
      button { padding: 10px 12px; border: 1px solid #ddd; border-radius: 10px; background: white; cursor: pointer; }
      button:hover { background: #f2f2f2; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
      .card { background: white; border: 1px solid #e8e8e8; border-radius: 14px; padding: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); display: flex; flex-direction: column; gap: 8px; }
      .title { font-weight: 650; line-height: 1.2; }
      .desc { color: #444; font-size: 14px; line-height: 1.35; }
      .links { display: flex; gap: 10px; margin-top: 6px; }
      a { color: #0b57d0; text-decoration: none; font-size: 14px; }
      a:hover { text-decoration: underline; }
      .pills { display: flex; gap: 6px; flex-wrap: wrap; }
      .pill { display: inline-block; font-size: 12px; padding: 2px 8px; border: 1px solid #e2e2e2; border-radius: 999px; background: #fff; color: #555; width: fit-content; }
      .status { margin: 10px 0 18px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      .count { font-weight: 600; color: #333; }
      .meta { color: #666; font-size: 13px; line-height: 1.25; }

      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .smallBtn { padding: 10px 12px; min-width: auto; }

      .warn { color: #8a5a00; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <div style="font-size: 20px; font-weight: 700;">Faculty Jobs</div>
        <div class="muted" id="subhead">Loading…</div>
      </div>

      <div class="controls">
        <input id="q" placeholder="Search title / description / college / location…" />
        <select id="source">
          <option value="all">All sources</option>
          <option value="CSU">CA - California State University</option>
          <option value="UC">CA - University of California</option>
          <option value="CT State">CT - Connecticut State Colleges & Universities</option>
          <option value="UMass">MA - University of Massachusetts</option>
          <option value="NJ">NJ - New Jersey Public Universities</option>
          <option value="CUNY">NY - City University of New York</option>
          <option value="PA">Pennsylvania State</option>
          <option value="Claremont Colleges">Claremont Colleges</option>
        </select>
        <button id="refresh" class="smallBtn" title="Reload jobs.json">Reload</button>
      </div>
    </header>

    <div class="status">
      <span class="muted" id="status">—</span>
      <span class="count" id="shown"></span>
    </div>

    <div class="grid" id="grid"></div>

    <script>
      const grid = document.getElementById("grid");
      const statusEl = document.getElementById("status");
      const subhead = document.getElementById("subhead");
      const shownEl = document.getElementById("shown");
      const q = document.getElementById("q");
      const sourceSel = document.getElementById("source");
      const refreshBtn = document.getElementById("refresh");

      let allJobs = [];
      let meta = { scrapedAt: null, count: 0 };

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({
          "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
        }[c]));
      }

      function truncate(s, n) {
        s = String(s);
        return s.length > n ? s.slice(0, n - 1) + "…" : s;
      }

      // Dedup pills
      function addPill(pillsEl, text, seen) {
        const t = (text || "").trim();
        if (!t) return;
        const key = t.toLowerCase();
        if (seen.has(key)) return;
        seen.add(key);

        const p = document.createElement("span");
        p.className = "pill";
        p.textContent = t;
        pillsEl.appendChild(p);
      }

      function normalizeJob(j) {
        return {
          title: j?.title ?? "(No title)",
          description: j?.description ?? null,
          url: j?.url ?? "#",
          source: j?.source ?? null,
          category: j?.category ?? null,
          college: j?.college ?? null,
          location: j?.location ?? null,
        };
      }

      function render(jobs) {
        grid.innerHTML = "";

        for (const raw of jobs) {
          const job = normalizeJob(raw);

          const card = document.createElement("div");
          card.className = "card";

          const title = document.createElement("div");
          title.className = "title";
          title.textContent = job.title || "(No title)";

          const pills = document.createElement("div");
          pills.className = "pills";
          const seen = new Set();

          // Hide source pill for CT (college pill already contains CT State <Campus>)
          if (job.source && job.source !== "CT State") addPill(pills, job.source, seen);

          // Category pill
          if (job.category) addPill(pills, job.category, seen);

          // College/campus chip
          if (job.college && job.college !== job.source) addPill(pills, job.college, seen);

          // Location meta line
          const metaLine = document.createElement("div");
          metaLine.className = "meta";
          const parts = [];
          if (job.location) parts.push(job.location);
          if (parts.length) metaLine.textContent = parts.join(" • ");

          const desc = document.createElement("div");
          desc.className = "desc";
          desc.textContent = job.description ? truncate(job.description, 240) : "";

          const links = document.createElement("div");
          links.className = "links";
          links.innerHTML = `<a href="${escapeHtml(job.url)}" target="_blank" rel="noreferrer">View job</a>`;

          card.appendChild(title);
          if (pills.childNodes.length) card.appendChild(pills);
          if (parts.length) card.appendChild(metaLine);
          if (job.description) card.appendChild(desc);
          card.appendChild(links);

          grid.appendChild(card);
        }

        shownEl.textContent = `${jobs.length} shown`;
      }

      function applyFilters() {
        const term = q.value.trim().toLowerCase();
        const src = sourceSel.value;

        let filtered = allJobs;

        if (src !== "all") filtered = filtered.filter(j => (j.source || "") === src);

        if (term) {
          filtered = filtered.filter(j => {
            const hay = [
              j.title, j.description, j.source, j.category, j.college, j.location
            ].filter(Boolean).join(" ").toLowerCase();
            return hay.includes(term);
          });
        }

        render(filtered);
      }

      async function load() {
        statusEl.textContent = "Fetching jobs…";
        statusEl.className = "muted";
        shownEl.textContent = "";
        grid.innerHTML = "";

        // Static site: jobs.json sits next to this HTML in /docs
        // Cache-bust so Reload works immediately after Actions updates
        const url = `./jobs.json?ts=${Date.now()}`;

        const r = await fetch(url, { cache: "no-store" });
        if (!r.ok) {
          const txt = await r.text().catch(() => "");
          statusEl.textContent = `Failed to load jobs.json (${r.status}).`;
          statusEl.className = "muted warn";
          subhead.textContent = "No data loaded";
          console.error("jobs.json fetch failed:", r.status, txt.slice(0, 200));
          return;
        }

        const data = await r.json();

        allJobs = Array.isArray(data.jobs) ? data.jobs : [];
        meta.scrapedAt = data.scrapedAt || null;
        meta.count = data.count || allJobs.length;

        const when = meta.scrapedAt ? new Date(meta.scrapedAt).toLocaleString() : "unknown time";
        subhead.textContent = `${allJobs.length} jobs • ${when} • static JSON`;

        statusEl.textContent = "Ready";
        statusEl.className = "muted";
        applyFilters();
      }

      q.addEventListener("input", applyFilters);
      sourceSel.addEventListener("change", applyFilters);
      refreshBtn.addEventListener("click", load);

      load().catch(err => {
        statusEl.textContent = "Failed to load: " + err.message;
        statusEl.className = "muted warn";
      });
    </script>
  </body>
</html>
